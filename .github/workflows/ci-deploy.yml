# SCI-PATH — one pipeline for all backends.
#
# Each service builds on its own GitHub runner (avoids disk-full on "all").
# Deploy targets 3 EC2s: core (LPE+UM+gaming), analytics, IAE.
# Until EC2_HOST_ANALYTICS / EC2_HOST_IAE are set, those jobs use EC2_HOST.
#
# Secrets — see docs/ecr-pipeline.md

name: sci-path-deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-deploy.yml"
      - "docker-compose.yml"
      - ".env.example"
      - ".gitmodules"
      - "services/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to rebuild"
        required: true
        default: all
        type: choice
        options:
          - all
          - lpe
          - um
          - gaming
          - analytics
          - iae
  repository_dispatch:
    types: [service-changed]

concurrency:
  group: sci-path-deploy-${{ github.event_name }}-${{ github.event.client_payload.service || inputs.service || 'main' }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  ECR_REGISTRY: 011877215030.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate docker compose file
        run: |
          cp .env.example .env
          docker compose config -q
          echo "Compose file is valid."

  resolve:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.pick.outputs.service }}
      source_repo: ${{ steps.pick.outputs.source_repo }}
      source_sha: ${{ steps.pick.outputs.source_sha }}
      image_tag: ${{ steps.pick.outputs.image_tag }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SVC="${{ github.event.client_payload.service }}"
            REPO="${{ github.event.client_payload.source_repo }}"
            SHA="${{ github.event.client_payload.sha }}"
          else
            SVC="${{ inputs.service }}"
            case "$SVC" in
              lpe) REPO="SCI-PATH/learning-path-engine"; SHA="dev" ;;
              um) REPO="SCI-PATH/user-management"; SHA="main" ;;
              gaming) REPO="SCI-PATH/gaming-service"; SHA="main" ;;
              analytics) REPO="SCI-PATH/learner-analytics-genai-support"; SHA="develop" ;;
              iae) REPO="SCI-PATH/intelligent-assessment-engine"; SHA="dev" ;;
              all) REPO="all"; SHA="all" ;;
              *) REPO="unknown"; SHA="unknown" ;;
            esac
          fi
          if [ -z "$SVC" ]; then SVC=all; fi
          if [ "$SHA" = "all" ] || [ "$SHA" = "unknown" ] || [ "$SHA" = "dev" ] || [ "$SHA" = "main" ] || [ "$SHA" = "develop" ]; then
            TAG="${GITHUB_SHA:0:7}"
          else
            TAG="${SHA:0:7}"
          fi
          echo "service=$SVC" >> "$GITHUB_OUTPUT"
          echo "source_repo=${REPO:-unknown}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SHA:-unknown}" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$SVC" = "all" ]; then
            echo 'matrix=["lpe","um","gaming","analytics","iae"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$SVC\"]" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved service=$SVC (from ${REPO:-manual}) tag=$TAG"

  build:
    needs: resolve
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        svc: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Set build metadata
        id: meta
        run: |
          case "${{ matrix.svc }}" in
            lpe)
              echo "github_repo=SCI-PATH/learning-path-engine" >> "$GITHUB_OUTPUT"
              echo "default_ref=dev" >> "$GITHUB_OUTPUT"
              echo "checkout_path=services/learning-path-engine" >> "$GITHUB_OUTPUT"
              echo "context=services/learning-path-engine/backend" >> "$GITHUB_OUTPUT"
              echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
              echo "local_tag=sci-path-lpe:ci" >> "$GITHUB_OUTPUT"
              echo "ecr_repo=sci-path/lpe" >> "$GITHUB_OUTPUT"
              ;;
            um)
              echo "github_repo=SCI-PATH/user-management" >> "$GITHUB_OUTPUT"
              echo "default_ref=main" >> "$GITHUB_OUTPUT"
              echo "checkout_path=services/user-management" >> "$GITHUB_OUTPUT"
              echo "context=services/user-management/backend" >> "$GITHUB_OUTPUT"
              echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
              echo "local_tag=sci-path-um:ci" >> "$GITHUB_OUTPUT"
              echo "ecr_repo=sci-path/um" >> "$GITHUB_OUTPUT"
              ;;
            gaming)
              echo "github_repo=SCI-PATH/gaming-service" >> "$GITHUB_OUTPUT"
              echo "default_ref=main" >> "$GITHUB_OUTPUT"
              echo "checkout_path=services/gaming-service" >> "$GITHUB_OUTPUT"
              echo "context=services/gaming-service/backend" >> "$GITHUB_OUTPUT"
              echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
              echo "local_tag=sci-path-gaming:ci" >> "$GITHUB_OUTPUT"
              echo "ecr_repo=sci-path/gaming" >> "$GITHUB_OUTPUT"
              ;;
            analytics)
              echo "github_repo=SCI-PATH/learner-analytics-genai-support" >> "$GITHUB_OUTPUT"
              echo "default_ref=develop" >> "$GITHUB_OUTPUT"
              echo "checkout_path=services/learner-analytics-genai-support" >> "$GITHUB_OUTPUT"
              echo "context=services/learner-analytics-genai-support" >> "$GITHUB_OUTPUT"
              echo "dockerfile=FastAPI-Backend/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "local_tag=sci-path-analytics:ci" >> "$GITHUB_OUTPUT"
              echo "ecr_repo=sci-path/analytics" >> "$GITHUB_OUTPUT"
              ;;
            iae)
              echo "github_repo=SCI-PATH/intelligent-assessment-engine" >> "$GITHUB_OUTPUT"
              echo "default_ref=dev" >> "$GITHUB_OUTPUT"
              echo "checkout_path=services/intelligent-assessment-engine" >> "$GITHUB_OUTPUT"
              echo "context=services/intelligent-assessment-engine" >> "$GITHUB_OUTPUT"
              echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
              echo "local_tag=sci-path-iae:ci" >> "$GITHUB_OUTPUT"
              echo "ecr_repo=sci-path/iae" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unknown svc ${{ matrix.svc }}"; exit 1 ;;
          esac

      - name: Checkout orchestration
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Verify submodule access token
        run: |
          if [ -z "${{ secrets.SUBMODULES_ACCESS_TOKEN }}" ]; then
            echo "Missing secret SUBMODULES_ACCESS_TOKEN on deployment-orchestration."
            exit 1
          fi

      - name: Checkout service source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.github_repo }}
          ref: ${{ needs.resolve.outputs.service == matrix.svc && needs.resolve.outputs.source_sha || steps.meta.outputs.default_ref }}
          path: ${{ steps.meta.outputs.checkout_path }}
          token: ${{ secrets.SUBMODULES_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build image
        run: |
          set -euo pipefail
          CONTEXT="${{ steps.meta.outputs.context }}"
          FILE="${{ steps.meta.outputs.dockerfile }}"
          TAG="${{ steps.meta.outputs.local_tag }}"
          if [ ! -d "$CONTEXT" ]; then
            echo "Missing $CONTEXT — checkout step failed?"
            ls -la services || true
            exit 1
          fi
          if [ "$FILE" = "Dockerfile" ]; then
            docker build --provenance=false -t "$TAG" "$CONTEXT"
          else
            docker build --provenance=false -f "$CONTEXT/$FILE" -t "$TAG" "$CONTEXT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.AWS_ACCESS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          REGISTRY="${{ env.ECR_REGISTRY }}"
          LOCAL="${{ steps.meta.outputs.local_tag }}"
          REPO="${{ steps.meta.outputs.ecr_repo }}"
          docker tag "$LOCAL" "${REGISTRY}/${REPO}:latest"
          docker tag "$LOCAL" "${REGISTRY}/${REPO}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${REPO}:latest"
          docker push "${REGISTRY}/${REPO}:${IMAGE_TAG}"

      - name: Build summary
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          echo "## ${{ matrix.svc }} → ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.ECR_REGISTRY }}/${{ steps.meta.outputs.ecr_repo }}:latest\` + \`:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-core:
    needs: [resolve, build]
    if: github.event_name != 'push' && (needs.resolve.outputs.service == 'all' || needs.resolve.outputs.service == 'lpe' || needs.resolve.outputs.service == 'um' || needs.resolve.outputs.service == 'gaming')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy core (LPE + UM + gaming)
        env:
          SERVICE: ${{ needs.resolve.outputs.service }}
          EC2_HOST: ${{ secrets.EC2_HOST_CORE || secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "Missing EC2_HOST / EC2_HOST_CORE or EC2_SSH_KEY"
            exit 1
          fi
          EC2_USER="${EC2_USER:-ubuntu}"
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ "$SERVICE" = "all" ]; then ARGS="core"; else ARGS="$SERVICE"; fi
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "cd /opt/sci-path/deployment-orchestration && bash scripts/ec2/deploy.sh ${ARGS}"

  deploy-analytics:
    needs: [resolve, build]
    if: github.event_name != 'push' && (needs.resolve.outputs.service == 'all' || needs.resolve.outputs.service == 'analytics')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy analytics
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_ANALYTICS || secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "Missing EC2_HOST_ANALYTICS / EC2_HOST or EC2_SSH_KEY"
            exit 1
          fi
          EC2_USER="${EC2_USER:-ubuntu}"
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "cd /opt/sci-path/deployment-orchestration && bash scripts/ec2/deploy.sh analytics"

  deploy-iae:
    needs: [resolve, build]
    if: github.event_name != 'push' && (needs.resolve.outputs.service == 'all' || needs.resolve.outputs.service == 'iae')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy IAE
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_IAE || secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "Missing EC2_HOST_IAE / EC2_HOST or EC2_SSH_KEY"
            exit 1
          fi
          EC2_USER="${EC2_USER:-ubuntu}"
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "cd /opt/sci-path/deployment-orchestration && bash scripts/ec2/deploy.sh iae"
