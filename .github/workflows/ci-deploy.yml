# SCI-PATH — one pipeline for all backends.
#
# Phase 1 (now): build + validate in GitHub Actions — no AWS.
# Phase 2 (later): enable job "deploy-cloud" after ECR + EC2 exist.
#
# Secrets (deployment-orchestration repo):
#   SUBMODULES_ACCESS_TOKEN — PAT with `repo` scope for all private SCI-PATH service repos
#
# Triggers:
#   - push main → fast compose validate only (no submodules)
#   - workflow_dispatch → build selected image(s)
#   - repository_dispatch (service-changed) → build one service from a backend repo push

name: sci-path-deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-deploy.yml"
      - "docker-compose.yml"
      - ".env.example"
      - ".gitmodules"
      - "services/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to rebuild"
        required: true
        default: all
        type: choice
        options:
          - all
          - lpe
          - um
          - gaming
          - analytics
          - iae
  repository_dispatch:
    types: [service-changed]

concurrency:
  group: sci-path-deploy-${{ github.event_name }}-${{ github.event.client_payload.service || inputs.service || 'main' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate docker compose file
        run: |
          cp .env.example .env
          docker compose config -q
          echo "Compose file is valid."

  resolve:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.pick.outputs.service }}
      source_repo: ${{ steps.pick.outputs.source_repo }}
      source_sha: ${{ steps.pick.outputs.source_sha }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SVC="${{ github.event.client_payload.service }}"
            REPO="${{ github.event.client_payload.source_repo }}"
            SHA="${{ github.event.client_payload.sha }}"
          else
            SVC="${{ inputs.service }}"
            case "$SVC" in
              lpe) REPO="SCI-PATH/learning-path-engine"; SHA="dev" ;;
              um) REPO="SCI-PATH/user-management"; SHA="main" ;;
              gaming) REPO="SCI-PATH/gaming-service"; SHA="main" ;;
              analytics) REPO="SCI-PATH/learner-analytics-genai-support"; SHA="develop" ;;
              iae) REPO="SCI-PATH/intelligent-assessment-engine"; SHA="dev" ;;
              all) REPO="all"; SHA="all" ;;
              *) REPO="unknown"; SHA="unknown" ;;
            esac
          fi
          if [ -z "$SVC" ]; then SVC=all; fi
          echo "service=$SVC" >> "$GITHUB_OUTPUT"
          echo "source_repo=${REPO:-unknown}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SHA:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Resolved service=$SVC (from ${REPO:-manual})"

  build:
    needs: resolve
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout orchestration
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout private service repositories
        env:
          SERVICE: ${{ needs.resolve.outputs.service }}
          SOURCE_REPO: ${{ needs.resolve.outputs.source_repo }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TOKEN: ${{ secrets.SUBMODULES_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "Missing secret SUBMODULES_ACCESS_TOKEN on deployment-orchestration."
            echo "Add a PAT with repo scope that can read all SCI-PATH service repos."
            exit 1
          fi

          clone_repo() {
            local repo="$1" dest="$2" ref="$3"
            echo "Cloning ${repo} → ${dest} @ ${ref}"
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            git -c http.extraHeader="AUTHORIZATION: bearer ${TOKEN}" \
              clone "https://github.com/${repo}.git" "$dest"
            git -C "$dest" -c http.extraHeader="AUTHORIZATION: bearer ${TOKEN}" \
              fetch --depth 1 origin "$ref"
            git -C "$dest" checkout FETCH_HEAD
          }

          declare -A REPOS=(
            [lpe]="SCI-PATH/learning-path-engine"
            [um]="SCI-PATH/user-management"
            [gaming]="SCI-PATH/gaming-service"
            [analytics]="SCI-PATH/learner-analytics-genai-support"
            [iae]="SCI-PATH/intelligent-assessment-engine"
          )
          declare -A PATHS=(
            [lpe]="services/learning-path-engine"
            [um]="services/user-management"
            [gaming]="services/gaming-service"
            [analytics]="services/learner-analytics-genai-support"
            [iae]="services/intelligent-assessment-engine"
          )
          declare -A DEFAULT_REFS=(
            [lpe]="dev"
            [um]="main"
            [gaming]="main"
            [analytics]="develop"
            [iae]="dev"
          )

          if [ "$SERVICE" = "all" ]; then
            for key in lpe um gaming analytics iae; do
              clone_repo "${REPOS[$key]}" "${PATHS[$key]}" "${DEFAULT_REFS[$key]}"
            done
          else
            repo="$SOURCE_REPO"
            ref="$SOURCE_SHA"
            if [ "$repo" = "unknown" ] || [ -z "$repo" ]; then
              repo="${REPOS[$SERVICE]}"
              ref="${DEFAULT_REFS[$SERVICE]}"
            fi
            clone_repo "$repo" "${PATHS[$SERVICE]}" "$ref"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build selected service image(s)
        env:
          SERVICE: ${{ needs.resolve.outputs.service }}
        run: |
          set -euo pipefail
          build_one () {
            local name="$1" context="$2" tag="$3" file="${4:-Dockerfile}"
            echo "::group::Build $name → $tag"
            if [ ! -d "$context" ]; then
              echo "Missing $context — checkout step failed?"
              exit 1
            fi
            if [ "$file" = "Dockerfile" ]; then
              docker build -t "$tag" "$context"
            else
              docker build -f "$context/$file" -t "$tag" "$context"
            fi
            echo "::endgroup::"
          }

          case "$SERVICE" in
            all)
              build_one lpe ./services/learning-path-engine/backend sci-path-lpe:ci
              build_one um ./services/user-management/backend sci-path-um:ci
              build_one gaming ./services/gaming-service/backend sci-path-gaming:ci
              build_one analytics ./services/learner-analytics-genai-support sci-path-analytics:ci FastAPI-Backend/Dockerfile
              build_one iae ./services/intelligent-assessment-engine sci-path-iae:ci
              ;;
            lpe) build_one lpe ./services/learning-path-engine/backend sci-path-lpe:ci ;;
            um) build_one um ./services/user-management/backend sci-path-um:ci ;;
            gaming) build_one gaming ./services/gaming-service/backend sci-path-gaming:ci ;;
            analytics) build_one analytics ./services/learner-analytics-genai-support sci-path-analytics:ci FastAPI-Backend/Dockerfile ;;
            iae) build_one iae ./services/intelligent-assessment-engine sci-path-iae:ci ;;
            *) echo "Unknown service: $SERVICE"; exit 1 ;;
          esac

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build summary
        env:
          SERVICE: ${{ needs.resolve.outputs.service }}
          SOURCE_REPO: ${{ needs.resolve.outputs.source_repo }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          echo "## SCI-PATH CI build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: **$SERVICE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$SOURCE_REPO\` @ \`${SOURCE_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud deploy: disabled (enable after AWS is ready)" >> "$GITHUB_STEP_SUMMARY"

  deploy-cloud:
    needs: build
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Push to ECR + restart EC2
        env:
          SERVICE: ${{ needs.resolve.outputs.service }}
        run: |
          echo "Phase 2 — wire when AWS exists:"
          echo "  1. aws ecr get-login-password | docker login ..."
          echo "  2. docker tag sci-path-*:ci \$ECR_REGISTRY/sci-path-*:latest"
          echo "  3. docker push ..."
          echo "  4. ssh ubuntu@\$EC2_HOST 'cd /opt/sci-path/deployment-orchestration && docker compose pull && docker compose up -d'"
          echo "Selected service: $SERVICE"
